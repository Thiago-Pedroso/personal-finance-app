# Suas categorias e subcategorias. VOCÊ manda nisto — edite à vontade.
#
# Dois formatos aceitos:
#   Categoria: [sub, sub, ...]                        # só as subcategorias
#   Categoria: {subs: [...], color: "#rrggbb",        # com cor/ícone/tratamento
#               icon: NomeLucide, treatment: fluxo,
#               essential: true}
#
# treatment: fluxo (conta em Receitas/Gastos) | poupança (vira "Poupado")
#            | movimento (fora da conta, só auditoria)
# essential: entra na base de cálculo da reserva de emergência
# icon: nome de um ícone lucide-react (ver o registry em frontend/src/lib/categories.jsx)
#
# A categorização (regras + IA) só usa nomes que existem aqui. Ao adicionar ou
# renomear, avise o Claude para reclassificar o que for preciso.

