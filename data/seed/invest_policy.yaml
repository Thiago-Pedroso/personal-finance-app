# Política de alocação de demonstração (dados SINTÉTICOS).
#
# Cada nó é uma fatia do pai, então o alvo de uma folha é o produto do caminho até a raiz:
# Ações = 80% x 60% x 70% = 33,6% da carteira. Mudar a estratégia é mexer aqui, e a forma
# é livre: dá para tirar o nível de país, trocar EUA por "Global" ou acrescentar um
# terceiro país sem tocar em código.
#
# in_totals: false tira o nó da conta de percentuais e do rebalanceamento, mas o dinheiro
# continua aparecendo no patrimônio. Serve para cripto, reserva e qualquer valor com
# destino já definido.

